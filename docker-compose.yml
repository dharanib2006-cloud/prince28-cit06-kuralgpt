
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app  # pragma: allowlist secret
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      network: host
    command: sh -c "alembic upgrade head && python scripts/load_db.py"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://app:app@db:5432/app  # pragma: allowlist secret
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      network: host
    command: uvicorn kuralgpt.api.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://app:app@db:5432/app  # pragma: allowlist secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
