[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kuralgpt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=1.26,<2",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".day3_api_backup"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poe.tasks]
dev = "uvicorn kuralgpt.api.main:create_app --factory --reload"
lint = { sequence = ["_ruff_check", "_ruff_format"] }
_ruff_check = "ruff check ."
_ruff_format = "ruff format --check ."
test = "pytest tests/unit"
test-integration = "pytest tests/integration"
cov = "pytest --cov=kuralgpt --cov-report=term-missing"
migrate = "alembic upgrade head"
seed = "python scripts/load_db.py"
